name: backend

on:
  push:
    branches: ['**']
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']

# A new push on the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every service is reported even when another one fails.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - job-service
          - application-service
          - dashboard-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Build and test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        # chmod: guard in case a wrapper loses its executable bit again (commits from Windows).
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
