name: CI/CD SmartRecruit

# Pipeline unique : chaque étape est un job, relié au suivant par `needs` (graphe visible dans l'onglet Actions).
#
#   1. Tests            backend (6 services) · frontend · service IA
#   2. Validation IaC   Kustomize · Helm · Terraform · Ansible
#   3. Images Docker    8 images construites ; publiées sur ghcr.io/<owner>/smartrecruit/<service> depuis main
#   4. Déploiement      VM Azure (runner installé sur la VM), depuis main, si DEPLOY_ENABLED=true
#   5. Tests de fumée   interface, Grafana et Kibana répondent sur la VM
on:
  push:
    branches: ['**']
    # Tag vX.Y.Z : images taguées X.Y.Z puis GitHub Release (BE-OPS-05).
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le pipeline encore en cours.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUBECONFORM_URL: https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
  CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  # ---------------------------------------------------------------- 1. Tests
  backend:
    name: "1 · Tests backend (${{ matrix.service }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, user-service, job-service, application-service, dashboard-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      - name: Build et tests Maven
        working-directory: backend/${{ matrix.service }}
        # chmod : le bit exécutable du wrapper se perd parfois avec des commits faits sous Windows.
        # JaCoCo (couverture, ISO 25010 maintenabilité) appelé en ligne de commande : aucun pom à modifier.
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent verify org.jacoco:jacoco-maven-plugin:0.8.14:report
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            backend/${{ matrix.service }}/target/surefire-reports/
            backend/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: "1 · Tests frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests (Vitest) + couverture
        run: npm run test:coverage
      - name: Dépendances vulnérables (npm audit, SCA)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  ai-service:
    name: "1 · Tests service IA"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest) + couverture
        run: pytest --cov=app --cov-branch
      - name: Sécurité (Bandit SAST, pip-audit SCA)
        run: |
          pip install bandit==1.8.6 pip-audit==2.9.0
          bandit -r app -q
          pip-audit -r requirements.txt

  # ------------------------------------------------------- 2. Validation IaC
  kustomize:
    name: "2 · Validation Kustomize"
    needs: [backend, frontend, ai-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions alignées (pom, package.json, IA, Helm, overlay prod, Terraform ; = tag vX.Y.Z)
        run: python3 deploy/scripts/check_versions.py ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - name: Rendu des overlays dev et prod
        run: |
          cp deploy/k8s/overlays/dev/secrets.env.example deploy/k8s/overlays/dev/secrets.env
          cp deploy/k8s/overlays/dev/config.env.example deploy/k8s/overlays/dev/config.env
          kubectl kustomize deploy/k8s/overlays/dev > dev.yaml
          kubectl kustomize deploy/k8s/overlays/prod > prod.yaml
      - name: Aucune image latest en prod
        run: |
          if grep -n 'image: .*:latest' prod.yaml; then echo "::error::image latest en prod"; exit 1; fi
      - name: Schémas Kubernetes (kubeconform)
        run: |
          curl -sSL "$KUBECONFORM_URL" | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 dev.yaml prod.yaml

  helm:
    name: "2 · Validation Helm"
    needs: [backend, frontend, ai-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: helm lint (smartrecruit, elk ; dev et prod)
        run: |
          for chart in smartrecruit elk; do
            helm lint deploy/helm/$chart
            helm lint deploy/helm/$chart -f deploy/helm/$chart/values-dev.yaml
            helm lint deploy/helm/$chart -f deploy/helm/$chart/values-prod.yaml
          done
      - name: helm template + kubeconform (CRDs comprises)
        run: |
          helm template smartrecruit deploy/helm/smartrecruit -n smartrecruit -f deploy/helm/smartrecruit/values-dev.yaml > app-dev.yaml
          helm template smartrecruit deploy/helm/smartrecruit -n smartrecruit -f deploy/helm/smartrecruit/values-prod.yaml > app-prod.yaml
          helm template elk deploy/helm/elk -n logging -f deploy/helm/elk/values-dev.yaml > elk-dev.yaml
          helm template elk deploy/helm/elk -n logging -f deploy/helm/elk/values-prod.yaml > elk-prod.yaml
          if grep -n 'image: .*smartrecruit/.*:latest' app-prod.yaml; then echo "::error::image latest en prod"; exit 1; fi
          curl -sSL "$KUBECONFORM_URL" | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default -schema-location "$CRDS_CATALOG" \
            app-dev.yaml app-prod.yaml elk-dev.yaml elk-prod.yaml
      - name: Tableau de bord Grafana et valeurs de monitoring
        run: |
          python3 -m json.tool deploy/helm/smartrecruit/files/smartrecruit-dashboard.json > /dev/null
          python3 -c "import yaml; yaml.safe_load(open('deploy/monitoring/kube-prometheus-stack-values.yaml'))"

  terraform:
    name: "2 · Validation Terraform"
    needs: [backend, frontend, ai-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  ansible:
    name: "2 · Validation Ansible"
    needs: [backend, frontend, ai-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install "ansible>=10,<12" ansible-lint yamllint
      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" .
      - name: ansible-playbook --syntax-check
        run: ansible-playbook site.yml --syntax-check
      # Informatif : signale les écarts aux bonnes pratiques sans bloquer le pipeline.
      - name: ansible-lint (informatif)
        run: ansible-lint site.yml
        continue-on-error: true

  # -------------------------------------------------------- 3. Images Docker
  images:
    name: "3 · Image ${{ matrix.name }}"
    needs: [kustomize, helm, terraform, ansible]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway, context: backend/api-gateway }
          - { name: auth-service, context: backend/auth-service }
          - { name: user-service, context: backend/user-service }
          - { name: job-service, context: backend/job-service }
          - { name: application-service, context: backend/application-service }
          - { name: dashboard-service, context: backend/dashboard-service }
          - { name: ai-service, context: ai-service }
          - { name: frontend, context: frontend }
    env:
      # Publication seulement depuis main (et les tags) ; ailleurs l'image est construite pour vérification.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartrecruit/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      # Trivy via son image Docker figée (0.69.3 : dernière version saine avant la compromission de mars 2026 ;
      # ne pas passer à trivy-action ni à un tag flottant).
      - name: Trivy — rapport HIGH/CRITICAL (SARIF)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.69.3 \
            image --quiet --severity HIGH,CRITICAL --format sarif -o /out/trivy.sarif \
            "ghcr.io/${{ github.repository_owner }}/smartrecruit/${{ matrix.name }}:sha-${{ github.sha }}"
      - name: Publication dans l'onglet Security
        if: always() && hashFiles('trivy.sarif') != '' && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}
      - name: Trivy — échec sur CRITICAL corrigeable
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 \
            image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "ghcr.io/${{ github.repository_owner }}/smartrecruit/${{ matrix.name }}:sha-${{ github.sha }}"

  release:
    name: "3 · Release GitHub"
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release avec notes générées
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  # ---------------------------------------------------------- 4. Déploiement
  # S'exécute sur le runner GitHub Actions installé sur la VM Azure (label smartrecruit-vm) : aucun port à ouvrir,
  # aucune clé SSH dans GitHub. Activation : variables du dépôt DEPLOY_ENABLED=true et VM_HOST (IP publique).
  deploy:
    name: "4 · Déploiement VM Azure"
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, smartrecruit-vm]
    timeout-minutes: 90
    environment:
      name: azure-vm
      url: http://${{ vars.VM_HOST }}.nip.io/
    steps:
      - uses: actions/checkout@v7
      - name: Archive du commit déployé
        run: git archive --format=tar.gz -o /tmp/smartrecruit.tar.gz HEAD
      - name: Ansible sur la VM (deploy/scripts/vm-install.sh)
        env:
          DOMAIN: ${{ vars.VM_HOST }}.nip.io
        run: bash deploy/scripts/vm-install.sh

  # ------------------------------------------------------- 5. Tests de fumée
  smoke-test:
    name: "5 · Tests de fumée"
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.VM_HOST }}.nip.io
    steps:
      - name: Interface (frontend via l'Ingress)
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -o /dev/null "http://$DOMAIN/"
      - name: API (gateway via l'Ingress)
        # 401 attendu sans jeton : le gateway répond, la chaîne Ingress -> gateway fonctionne.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$DOMAIN/api/v1/jobs")
          echo "GET /api/v1/jobs -> $code"
          [ "$code" = "200" ] || [ "$code" = "401" ]
      - name: Grafana
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "http://grafana.$DOMAIN/api/health"
      - name: Kibana
        # Kibana redémarre à chaque déploiement et met ~8 min à repasser « available » (503 entre-temps) sur la VM
        # 2 vCPU : on l'attend jusqu'à 15 min.
        run: curl -fsS --retry 90 --retry-delay 10 --retry-all-errors -o /dev/null "http://kibana.$DOMAIN/api/status"
