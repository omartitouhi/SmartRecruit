spring:
  datasource:
    url: jdbc:h2:mem:user_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

internal-auth:
  secret: test-only-internal-auth-secret

cv-storage:
  directory: target/test-cvs
  encryption-key: c21hcnRyZWNydWl0LXRlc3Qtb25seS1jdmtleS0zMmI=

gdpr:
  erasure:
    deadline: 30d
    retry-interval: 5m
    scheduler-enabled: false
    immediate: false
    auth-service-uri: http://localhost:1
    ai-service-uri: http://localhost:1
