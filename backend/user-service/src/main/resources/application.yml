server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service
  servlet:
    multipart:
      # BE-USER-02: CV limited to 5 MB; the request limit leaves room for the multipart envelope.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:smartrecruit}
    password: ${DB_PASSWORD:smartrecruit}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

internal-auth:
  # Verifies the identity headers signed by the api-gateway (BE-SEC-04).
  secret: ${INTERNAL_AUTH_SECRET:dev-only-internal-auth-secret-change-in-production}

cv-storage:
  directory: ${CV_STORAGE_DIR:./data/cvs}
  # BE-SEC-01: AES-256 key (32 bytes, base64) used to encrypt CVs at rest.
  # The default is for local development only: generate a real one with `openssl rand -base64 32`.
  encryption-key: ${CV_ENCRYPTION_KEY:c21hcnRyZWNydWl0LWRldi1vbmx5LWN2LWtleS0zMmI=}

gdpr:
  erasure:
    # BE-SEC-02: a deleted account must be erased from every service within 30 days.
    deadline: 30d
    retry-interval: ${GDPR_ERASURE_RETRY_INTERVAL:5m}
    scheduler-enabled: true
    immediate: true
    auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
    ai-service-uri: ${AI_SERVICE_URI:http://localhost:8000}

cv-analysis:
  # BE-CV-01: call ai-service after each CV upload (asynchronous, best-effort).
  enabled: ${CV_ANALYSIS_ENABLED:true}

company-invitation:
  # BE-COMP-03: invitations to join a company; the link is logged (no mail server in the MVP).
  token-ttl: 7d
  link-base-url: ${COMPANY_INVITATION_LINK_BASE_URL:http://localhost:5173/invitations/accept}

services:
  # Audit events of candidate data views (best effort, asynchronous).
  dashboard-service-uri: ${DASHBOARD_SERVICE_URI:http://localhost:8085}
