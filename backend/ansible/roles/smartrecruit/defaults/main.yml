---
smartrecruit_backend_dir: "{{ smartrecruit_install_dir }}/smartrecruit-backend"
smartrecruit_terraform_dir: "{{ smartrecruit_backend_dir }}/terraform"
# Les commandes de déploiement tournent en root (le groupe docker de l'utilisateur n'est actif qu'à sa
# prochaine connexion) mais écrivent le kubeconfig chez l'utilisateur, qui récupère ensuite les fichiers.
smartrecruit_deploy_env:
  HOME: "{{ smartrecruit_user_home }}"
  KUBECONFIG: "{{ smartrecruit_user_home }}/.kube/config"
# Durée maximale d'un déploiement (construction des images + démarrage du cluster), en secondes.
smartrecruit_deploy_timeout: 2700
# Page d'accueil vérifiée à la fin, selon la méthode de déploiement.
smartrecruit_check_urls:
  terraform: "http://{{ smartrecruit_base_domain }}/"
  compose: "http://localhost:{{ smartrecruit_frontend_host_port }}/"
  kind-script: "http://localhost:8090/"
