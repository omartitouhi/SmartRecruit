spring:
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

auth:
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256
    access-token-ttl: 1h
    refresh-token-ttl: 7d
  lockout:
    max-attempts: 5
    window: 15m
    duration: 15m
  password-reset:
    token-ttl: 30m
    link-base-url: http://localhost:5173/reset-password

internal-auth:
  secret: test-only-internal-auth-secret
