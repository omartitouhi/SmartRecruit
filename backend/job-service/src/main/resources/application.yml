server:
  port: ${SERVER_PORT:8083}

spring:
  # Auth is JWT + internal headers: no default in-memory user (and no generated password in the logs).
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_db}
    username: ${DB_USER:smartrecruit}
    password: ${DB_PASSWORD:smartrecruit}
  jpa:
    # Kept on (lazy @ElementCollection read in controllers); set explicitly to silence the startup warning.
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Buckets d'histogramme pour la latence HTTP (histogram_quantile() dans Prometheus/Grafana).
      percentiles-histogram:
        http.server.requests: true

internal-auth:
  # Verifies the identity headers signed by the api-gateway (BE-SEC-04).
  secret: ${INTERNAL_AUTH_SECRET:dev-only-internal-auth-secret-change-in-production}

services:
  # BE-REC-01: AI recommendations, enriched with company names from user-service.
  ai-service-uri: ${AI_SERVICE_URI:http://localhost:8000}
  user-service-uri: ${USER_SERVICE_URI:http://localhost:8082}
  # BE-JOB-05: number of applications per offer, for the recruiter's own listing.
  application-service-uri: ${APPLICATION_SERVICE_URI:http://localhost:8084}

jobs:
  expiry:
    # EXT-JOB-01: close published offers whose application deadline is over.
    enabled: ${JOBS_EXPIRY_ENABLED:true}
    interval: ${JOBS_EXPIRY_INTERVAL:5m}
