spring:
  datasource:
    url: jdbc:h2:mem:job_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

internal-auth:
  secret: test-only-internal-auth-secret

services:
  ai-service-uri: http://localhost:1
  user-service-uri: http://localhost:1
  application-service-uri: http://localhost:1
