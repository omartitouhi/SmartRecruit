name: k8s

on:
  push:
    paths: ["k8s/**", ".github/workflows/k8s.yml"]
  pull_request:
    paths: ["k8s/**", ".github/workflows/k8s.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the overlays
        run: |
          cp k8s/overlays/dev/secrets.env.example k8s/overlays/dev/secrets.env
          kubectl kustomize k8s/overlays/dev > dev.yaml
          kubectl kustomize k8s/overlays/prod > prod.yaml
      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 dev.yaml prod.yaml
