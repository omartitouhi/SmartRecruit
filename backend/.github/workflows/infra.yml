name: infra

# Vérifie l'infrastructure as code : charts Helm, Terraform, Ansible, valeurs de monitoring.
on:
  push:
    paths: ["helm/**", "terraform/**", "ansible/**", "monitoring/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["helm/**", "terraform/**", "ansible/**", "monitoring/**", ".github/workflows/infra.yml"]

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint the charts
        run: |
          for chart in smartrecruit elk; do
            helm lint helm/$chart
            helm lint helm/$chart -f helm/$chart/values-dev.yaml
            helm lint helm/$chart -f helm/$chart/values-prod.yaml
          done
      - name: Render the charts
        run: |
          helm template smartrecruit helm/smartrecruit -n smartrecruit -f helm/smartrecruit/values-dev.yaml > app-dev.yaml
          helm template smartrecruit helm/smartrecruit -n smartrecruit -f helm/smartrecruit/values-prod.yaml > app-prod.yaml
          helm template elk helm/elk -n logging -f helm/elk/values-dev.yaml > elk-dev.yaml
          helm template elk helm/elk -n logging -f helm/elk/values-prod.yaml > elk-prod.yaml
      - name: Validate against the Kubernetes schemas (CRDs included)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            app-dev.yaml app-prod.yaml elk-dev.yaml elk-prod.yaml
      - name: Check the Grafana dashboard JSON
        run: python3 -m json.tool helm/smartrecruit/files/smartrecruit-dashboard.json > /dev/null
      - name: Check the kube-prometheus-stack values
        run: python3 -c "import yaml; yaml.safe_load(open('monitoring/kube-prometheus-stack-values.yaml'))"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint yamllint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" .
      - run: ansible-playbook site.yml --syntax-check
      # Informatif : signale les écarts aux bonnes pratiques sans bloquer la CI.
      - run: ansible-lint site.yml
        continue-on-error: true
