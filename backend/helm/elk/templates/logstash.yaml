{{- if .Values.logstash.enabled -}}
{{- $ls := .Values.logstash -}}
{{- $name := include "elk.componentName" (dict "ctx" . "component" "logstash") -}}
# Logstash : reçoit les événements de Filebeat, les transforme (filter) puis les envoie à Elasticsearch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "logstash") | nindent 4 }}
data:
  # Paramètres généraux : API de supervision ouverte (sonde de disponibilité), monitoring X-Pack coupé.
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    xpack.monitoring.enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-pipeline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "logstash") | nindent 4 }}
data:
  # Pipeline en trois sections, comme dans le lab : input -> filter -> output.
  smartrecruit.conf: |
    {{- include "elk.logstash.pipeline" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "logstash") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "elk.selectorLabels" (dict "ctx" . "component" "logstash") | nindent 4 }}
  ports:
    - name: beats
      port: 5044
      targetPort: beats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "logstash") | nindent 4 }}
spec:
  replicas: {{ $ls.replicas }}
  selector:
    matchLabels:
      {{- include "elk.selectorLabels" (dict "ctx" . "component" "logstash") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elk.labels" (dict "ctx" . "component" "logstash") | nindent 8 }}
      annotations:
        # Redémarre les pods quand le pipeline change (helm upgrade).
        checksum/pipeline: {{ include "elk.logstash.pipeline" . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: logstash
          image: {{ include "elk.image" (dict "ctx" . "image" $ls.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: beats
              containerPort: 5044
            - name: monitoring
              containerPort: 9600
          env:
            - name: LS_JAVA_OPTS
              value: {{ $ls.javaOpts | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: monitoring
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: monitoring
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml $ls.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: pipeline
          configMap:
            name: {{ $name }}-pipeline
{{- end }}
