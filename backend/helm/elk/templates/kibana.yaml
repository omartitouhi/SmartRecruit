{{- $kb := .Values.kibana -}}
{{- $name := include "elk.componentName" (dict "ctx" . "component" "kibana") -}}
# Kibana : interface web de recherche et de visualisation des logs (Discover, tableaux de bord).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "kibana") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "elk.selectorLabels" (dict "ctx" . "component" "kibana") | nindent 4 }}
  ports:
    - name: http
      port: 5601
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "kibana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elk.selectorLabels" (dict "ctx" . "component" "kibana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elk.labels" (dict "ctx" . "component" "kibana") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kibana
          image: {{ include "elk.image" (dict "ctx" . "image" $kb.image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
          env:
            # Équivalent de elasticsearch.hosts dans kibana.yml (cf. lab).
            - name: ELASTICSEARCH_HOSTS
              value: '["{{ include "elk.elasticsearch.url" . }}"]'
            - name: SERVER_NAME
              value: {{ $name }}
            {{- if $kb.ingress.enabled }}
            - name: SERVER_PUBLICBASEURL
              value: {{ printf "%s://%s" (ternary "https" "http" (not (empty $kb.ingress.tls))) $kb.ingress.host | quote }}
            {{- end }}
            - name: TELEMETRY_OPTIN
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml $kb.resources | nindent 12 }}
{{- if $kb.ingress.enabled }}
---
# Accès navigateur par l'Ingress NGINX (hébergement virtuel par nom, cf. cours Ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elk.labels" (dict "ctx" . "component" "kibana") | nindent 4 }}
  {{- with $kb.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $kb.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $kb.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $kb.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
