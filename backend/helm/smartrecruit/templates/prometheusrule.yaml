{{- if and .Values.monitoring.enabled .Values.monitoring.alerts.enabled }}
# Règles d'alerte évaluées par Prometheus, envoyées à Alertmanager (kube-prometheus-stack).
# Métriques utilisées :
#   http_server_requests_seconds_*  (Spring Boot / Micrometer : Counter + Histogram)
#   http_requests_total, http_request_duration_seconds_*  (service IA : Counter + Histogram)
#   jvm_memory_*_bytes (Gauge), kube_pod_container_status_restarts_total (kube-state-metrics, Counter)
{{- $ns := .Release.Namespace }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "smartrecruit.fullname" . }}-alerts
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: smartrecruit.availability
      rules:
        - alert: SmartRecruitServiceDown
          expr: up{namespace="{{ $ns }}"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: {{`"{{ $labels.service }} ne répond plus à Prometheus"`}}
            description: {{`"La cible {{ $labels.instance }} ({{ $labels.pod }}) est injoignable depuis 2 minutes."`}}
        - alert: SmartRecruitPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}"}[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: {{`"{{ $labels.pod }} redémarre en boucle"`}}
            description: {{`"Plus de 3 redémarrages du conteneur {{ $labels.container }} en 15 minutes (CrashLoopBackOff ?)."`}}
    - name: smartrecruit.http
      rules:
        # Taux d'erreurs 5xx des services Spring (rate() sur un Counter).
        - alert: SmartRecruitHighErrorRate
          expr: |
            sum by (service) (rate(http_server_requests_seconds_count{namespace="{{ $ns }}", status=~"5.."}[5m]))
              /
            sum by (service) (rate(http_server_requests_seconds_count{namespace="{{ $ns }}"}[5m]))
              > {{ .Values.monitoring.alerts.errorRateThreshold }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: {{`"Trop d'erreurs 5xx sur {{ $labels.service }}"`}}
            description: {{`"{{ $value | humanizePercentage }} des requêtes échouent depuis 5 minutes."`}}
        - alert: SmartRecruitAiHighErrorRate
          expr: |
            sum by (service) (rate(http_requests_total{namespace="{{ $ns }}", status="5xx"}[5m]))
              /
            sum by (service) (rate(http_requests_total{namespace="{{ $ns }}"}[5m]))
              > {{ .Values.monitoring.alerts.errorRateThreshold }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Trop d'erreurs 5xx sur le service IA"
            description: {{`"{{ $value | humanizePercentage }} des requêtes IA échouent depuis 5 minutes."`}}
        # Latence p95 calculée à partir des buckets de l'Histogram.
        - alert: SmartRecruitHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace="{{ $ns }}", uri!~"/actuator.*"}[5m]))
            ) > {{ .Values.monitoring.alerts.latencyP95Seconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`"{{ $labels.service }} est lent (p95)"`}}
            description: {{`"95 % des requêtes prennent moins de {{ $value | humanizeDuration }}, au-dessus du seuil."`}}
    - name: smartrecruit.jvm
      rules:
        - alert: SmartRecruitJvmHeapHigh
          expr: |
            sum by (service, pod) (jvm_memory_used_bytes{namespace="{{ $ns }}", area="heap"})
              /
            sum by (service, pod) (jvm_memory_max_bytes{namespace="{{ $ns }}", area="heap"} > 0)
              > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{`"Mémoire heap JVM presque pleine sur {{ $labels.pod }}"`}}
            description: {{`"Heap utilisée à {{ $value | humanizePercentage }} depuis 10 minutes."`}}
{{- end }}
