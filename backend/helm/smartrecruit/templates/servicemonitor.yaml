{{- if .Values.monitoring.enabled }}
# Prometheus (opérateur de kube-prometheus-stack) découvre les Services à « scraper » via ces ServiceMonitors.
# Modèle pull : Prometheus interroge périodiquement l'endpoint de métriques de chaque pod.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "smartrecruit.fullname" . }}-spring
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      metrics: actuator
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.monitoring.interval }}
      # Label `service` = nom du Service Kubernetes (auth-service, job-service...).
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "smartrecruit.fullname" . }}-ai
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      metrics: fastapi
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
{{- end }}
