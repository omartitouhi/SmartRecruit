{{- if .Values.ingress.enabled }}
# Point d'entrée unique (fanout simple, cf. cours Ingress) :
#   /api -> api-gateway (l'Ingress voit l'IP réelle du client, utile à la limite de requêtes)
#   /    -> frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smartrecruit.fullname" . }}
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
{{- end }}
