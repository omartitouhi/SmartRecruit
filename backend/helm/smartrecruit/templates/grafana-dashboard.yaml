{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled }}
# Tableau de bord Grafana : le sidecar de Grafana (kube-prometheus-stack) charge automatiquement
# toute ConfigMap portant le label grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smartrecruit.fullname" . }}-dashboard
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    # Dossier Grafana (si le sidecar est configuré avec folderAnnotation).
    grafana_folder: SmartRecruit
data:
  smartrecruit-overview.json: |-
    {{- .Files.Get "files/smartrecruit-dashboard.json" | nindent 4 }}
{{- end }}
