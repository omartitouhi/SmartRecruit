# Inventaire SmartRecruit : machines à préparer, rangées par groupes.

# La machine de contrôle elle-même (Ubuntu ou WSL2) : pas de SSH.
[smartrecruit_local]
localhost ansible_connection=local

# Machines distantes (VM Vagrant/VirtualBox, serveur). Accès SSH par clé : ssh-copy-id vagrant@192.168.56.10
[smartrecruit_vms]
# vm1 ansible_host=192.168.56.10 ansible_user=vagrant
# vm2 ansible_host=192.168.56.11 ansible_user=vagrant

# Groupe parent ciblé par site.yml.
[smartrecruit:children]
smartrecruit_local
smartrecruit_vms
