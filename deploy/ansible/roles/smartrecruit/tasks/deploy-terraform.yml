---
# Les images locales gardent le tag latest : leur identifiant indique à Terraform lesquelles recharger dans kind
# et quels pods redémarrer. Lecture seule, donc exécutée aussi en --check.
- name: Lire l'identifiant des images construites
  ansible.builtin.command:
    argv:
      - docker
      - image
      - ls
      - --no-trunc
      - --filter
      - "reference=smartrecruit-*:{{ smartrecruit_image_tag }}"
      - --format
      - json
  register: smartrecruit_local_images
  changed_when: false
  check_mode: false
  when: smartrecruit_load_local_images | bool and smartrecruit_image_registry == ""

- name: Mémoriser l'identifiant de chaque image
  ansible.builtin.set_fact:
    smartrecruit_local_image_ids: >-
      {{ smartrecruit_local_images.stdout_lines | default([]) | map('from_json')
         | items2dict(key_name='Repository', value_name='ID') }}

- name: Générer terraform.tfvars (lu automatiquement par Terraform)
  ansible.builtin.template:
    src: terraform.tfvars.j2
    dest: "{{ smartrecruit_terraform_dir }}/terraform.tfvars"
    owner: "{{ smartrecruit_user }}"
    group: "{{ smartrecruit_user }}"
    mode: "0600"
  no_log: true
  diff: false

# terraform init + plan + apply ; idempotent : « ok » si l'état correspond déjà à la configuration.
# État local : deploy/terraform/state/terraform.tfstate (backend "local" déclaré dans le code Terraform).
- name: Appliquer la configuration Terraform (cluster kind, chart Helm, monitoring, logging)
  community.general.terraform:
    project_path: "{{ smartrecruit_terraform_dir }}"
    binary_path: /usr/local/bin/terraform
    state: present
    force_init: true
  environment: "{{ smartrecruit_deploy_env }}"
  vars:
    # Statut async dans un chemin absolu : avec HOME redirigé, « ~/.ansible_async » serait résolu chez
    # l'utilisateur par la tâche mais chez root par le suivi (« could not find job »).
    ansible_async_dir: /root/.ansible_async
  async: "{{ 0 if ansible_check_mode else smartrecruit_deploy_timeout }}"  # async interdit en --check
  poll: 15
  register: smartrecruit_tf

- name: Rendre l'état Terraform et le kubeconfig à l'utilisateur
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ smartrecruit_user }}"
    group: "{{ smartrecruit_user }}"
  loop:
    - "{{ smartrecruit_terraform_dir }}"
    - "{{ smartrecruit_user_home }}/.kube"

- name: Afficher les sorties Terraform (hors valeurs sensibles)
  ansible.builtin.debug:
    msg: "{{ item.key }} = {{ item.value.value }}"
  loop: "{{ smartrecruit_tf.outputs | default({}) | dict2items | rejectattr('value.sensitive') | list }}"
  loop_control:
    label: "{{ item.key }}"
