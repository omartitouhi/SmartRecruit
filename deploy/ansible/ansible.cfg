# Configuration propre au projet : surcharge /etc/ansible/ansible.cfg (lue quand on lance ansible depuis ce dossier).
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
