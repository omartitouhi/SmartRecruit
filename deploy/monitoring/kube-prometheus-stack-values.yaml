# Valeurs du chart kube-prometheus-stack (Prometheus Operator, Prometheus, Alertmanager, Grafana,
# node-exporter, kube-state-metrics) pour SmartRecruit.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f deploy/monitoring/kube-prometheus-stack-values.yaml
#
# Terraform (module platform-addons) installe ce chart avec ce fichier ; l'ingress Grafana y est
# surchargé selon base_domain.

# --- Prometheus (StatefulSet : données de séries temporelles sur un volume persistant) ---
prometheus:
  prometheusSpec:
    # Lire TOUS les ServiceMonitors / PodMonitors / PrometheusRules du cluster, pas seulement ceux
    # portant le label release=monitoring (ceux du chart smartrecruit l'ont aussi, par sécurité).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 7d
    retentionSize: 4GB
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# --- Alertmanager : reçoit les alertes (PrometheusRule smartrecruit-alerts) ---
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }
  # Exemple de routage (à compléter : Slack, e-mail...). Par défaut les alertes restent visibles dans l'UI.
  config:
    route:
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
    receivers:
      - name: "null"

# --- Grafana : tableaux de bord (source de données Prometheus préconfigurée) ---
grafana:
  # Mot de passe admin généré et stocké dans le Secret monitoring-grafana :
  #   kubectl -n monitoring get secret monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 --decode
  defaultDashboardsTimezone: browser
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts: [grafana.smartrecruit.local]
  # Le sidecar charge les ConfigMaps labellisées grafana_dashboard=1 de tous les namespaces
  # (tableau de bord « SmartRecruit - Vue d'ensemble » du chart smartrecruit).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

# --- Exporters ---
# node-exporter : DaemonSet, un pod par nœud (CPU, mémoire, disque, réseau des machines).
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
# kube-state-metrics : état des objets Kubernetes (redémarrages, réplicas disponibles...).
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 128Mi }

# kind / clusters managés : ces composants du plan de contrôle ne sont pas joignables par Prometheus
# (ils écoutent sur 127.0.0.1) ; les désactiver évite des cibles « down » et des alertes permanentes.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
