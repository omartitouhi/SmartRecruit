# Cluster local (kind) : petites ressources, Kibana exposé par l'Ingress NGINX.
# Réservations CPU basses : une VM de 2 vCPU doit accueillir Kubernetes, le monitoring, ELK et l'application.
# Ajouter "127.0.0.1 kibana.smartrecruit.local" au fichier hosts.
elasticsearch:
  javaOpts: "-Xms512m -Xmx512m"
  # shortcut: lab uniquement. Les disques de poste de travail dépassent souvent les seuils (90 %) et
  # Elasticsearch passerait les index en lecture seule.
  extraEnv:
    - name: cluster.routing.allocation.disk.threshold_enabled
      value: "false"
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 768Mi
    limits:
      memory: 1280Mi

logstash:
  javaOpts: "-Xms256m -Xmx256m"
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 768Mi

filebeat:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 200Mi

kibana:
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 900Mi
  ingress:
    enabled: true
    className: nginx
    host: kibana.smartrecruit.local
