# Développement local (kind / minikube) :
#   helm upgrade --install smartrecruit ./helm/smartrecruit -n smartrecruit --create-namespace -f deploy/helm/smartrecruit/values-dev.yaml
# Images construites par `docker compose build` puis chargées dans le cluster (kind load docker-image ...).

images:
  registry: ""
  prefix: smartrecruit-
  tag: latest
  pullPolicy: IfNotPresent

config:
  # Tous les clients partagent l'IP du proxy en local : pas de limite réaliste.
  RATE_LIMIT_MAX_REQUESTS: "500"
  # JVM plus légères au démarrage sur une petite machine : compilateur JIT C1 seul, GC série (peu de threads).
  JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -XX:+UseSerialGC"

# Six JVM qui démarrent en même temps sur 2 vCPU : jusqu'à 15 minutes avant le premier redémarrage.
probes:
  startupFailureThreshold: 180

# Valeurs de développement uniquement (identiques à deploy/k8s/overlays/dev/secrets.env.example).
secrets:
  create: true
  values:
    DB_USER: smartrecruit
    DB_PASSWORD: smartrecruit
    JWT_SECRET: dev-only-secret-change-in-production
    INTERNAL_AUTH_SECRET: dev-only-internal-secret-change-in-production
    CV_ENCRYPTION_KEY: c21hcnRyZWNydWl0LWRldi1vbmx5LWN2LWtleS0zMmI=
    ADMIN_EMAIL: admin@smartrecruit.local
    ADMIN_PASSWORD: Admin-Dev-2026!
    OPENROUTER_API_KEY: ""

# Ingress en local aussi (cf. Lab 2) : http://smartrecruit.local
# Prérequis : contrôleur ingress-nginx (minikube addons enable ingress, ou Terraform pour kind)
# et « 127.0.0.1 smartrecruit.local » dans le fichier hosts.
ingress:
  enabled: true
  className: nginx
  host: smartrecruit.local

postgres:
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

# Réservations CPU basses (pas de limite CPU) : sur une VM de 2 vCPU, Kubernetes, le monitoring et ELK réservent
# déjà l'essentiel ; les services consomment peu au repos et peuvent dépasser leur réservation au démarrage.
services:
  auth-service: { resources: { requests: { cpu: 25m } } }
  user-service: { resources: { requests: { cpu: 25m } } }
  job-service: { resources: { requests: { cpu: 25m } } }
  application-service: { resources: { requests: { cpu: 25m } } }
  dashboard-service: { resources: { requests: { cpu: 25m } } }
  api-gateway: { resources: { requests: { cpu: 25m } } }
  ai-service: { resources: { requests: { cpu: 25m } } }
  frontend: { resources: { requests: { cpu: 10m } } }

cvStorage:
  size: 1Gi

# Activé par Terraform quand kube-prometheus-stack est installé (CRDs ServiceMonitor/PrometheusRule).
monitoring:
  enabled: false
