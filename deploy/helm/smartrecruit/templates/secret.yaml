{{- if .Values.secrets.create }}
{{- /*
Secret applicatif. Les valeurs vides sont générées aléatoirement à la première installation puis
conservées lors des upgrades (lookup du Secret déjà présent dans le cluster).
*/}}
{{- $name := include "smartrecruit.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
  annotations:
    # Ne pas supprimer le Secret (et donc les mots de passe de la base) lors d'un helm uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "DB_PASSWORD" "JWT_SECRET" "INTERNAL_AUTH_SECRET" "ADMIN_PASSWORD" }}
  {{- if index $v $key }}
  {{ $key }}: {{ index $v $key | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- /* Clé AES : 32 octets encodés en base64 (la valeur elle-même est du base64). */}}
  {{- if $v.CV_ENCRYPTION_KEY }}
  CV_ENCRYPTION_KEY: {{ $v.CV_ENCRYPTION_KEY | b64enc | quote }}
  {{- else if hasKey $existing "CV_ENCRYPTION_KEY" }}
  CV_ENCRYPTION_KEY: {{ index $existing "CV_ENCRYPTION_KEY" | quote }}
  {{- else }}
  CV_ENCRYPTION_KEY: {{ randAlphaNum 32 | b64enc | b64enc | quote }}
  {{- end }}
  DB_USER: {{ $v.DB_USER | default "smartrecruit" | b64enc | quote }}
  ADMIN_EMAIL: {{ $v.ADMIN_EMAIL | default "admin@smartrecruit.local" | b64enc | quote }}
  OPENROUTER_API_KEY: {{ $v.OPENROUTER_API_KEY | default "" | b64enc | quote }}
{{- end }}
