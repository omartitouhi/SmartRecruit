{{- if .Values.networkPolicies.enabled }}
# Isolation réseau (nécessite un CNI qui applique les NetworkPolicies : Calico, Cilium...).
# Chaîne autorisée : Ingress -> frontend et api-gateway ; api-gateway -> services ; services -> services ;
# services -> Postgres ; Prometheus (namespace monitoring) -> ports HTTP des services (métriques).
# shortcut: aucune règle de sortie (egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-edge
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: tier
        operator: In
        values: ["web", "api"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressControllerNamespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-and-services-to-services
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      tier: service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: tier
                operator: In
                values: ["api", "service"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      tier: data
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: service
      ports:
        - protocol: TCP
          port: 5432
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    {{- include "smartrecruit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: tier
        operator: In
        values: ["api", "service"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.monitoringNamespace }}
{{- end }}
{{- end }}
