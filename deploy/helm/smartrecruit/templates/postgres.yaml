# Postgres unique, une base logique par microservice créée au premier démarrage.
# shortcut: une seule instance sans réplication ; passer à un service managé ou à un opérateur (CloudNativePG) en production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smartrecruit.fullname" . }}-postgres-init
  labels:
    {{- include "smartrecruit.componentLabels" (dict "root" . "name" "postgres") | nindent 4 }}
data:
  01-init-databases.sh: |
    #!/usr/bin/env bash
    set -e

    for DB in {{ join " " .Values.postgres.databases }}; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
        CREATE DATABASE $DB;
    EOSQL
    done
---
# Service « headless » (clusterIP: None) : nom DNS stable postgres-0.postgres pour le StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "smartrecruit.componentLabels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "smartrecruit.selectorLabels" (dict "root" . "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# StatefulSet : nom stable (postgres-0) et volume persistant dédié (volumeClaimTemplates).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "smartrecruit.componentLabels" (dict "root" . "name" "postgres") | nindent 4 }}
    tier: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "smartrecruit.selectorLabels" (dict "root" . "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smartrecruit.componentLabels" (dict "root" . "name" "postgres") | nindent 8 }}
        tier: data
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "smartrecruit.secretName" . }}
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "smartrecruit.secretName" . }}
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ include "smartrecruit.fullname" . }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
